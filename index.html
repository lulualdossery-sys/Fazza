<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fazza | فزعة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<style>
:root{--bg:#0b0d14;--card:#131726;--line:#232944;--ink:#eef0fa;--mut:#8f97b8;--acc:#7b5cff;--ok:#3ecf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Geist,"IBM Plex Sans Arabic",system-ui,sans-serif}
[dir=rtl] body{font-family:"IBM Plex Sans Arabic",Geist,system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 24px}
.logo{font-weight:600;font-size:1.2rem;margin-inline-end:auto}
.stat{color:var(--mut);font-size:13px}.stat b{color:var(--ink)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px}
.btn.go{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#06210f}
input,textarea{width:100%;background:#0e1120;border:1px solid var(--line);border-radius:12px;padding:11px 14px}
input:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
textarea{min-height:160px;resize:vertical}
.hero{padding:36px 28px;border-radius:24px;background:linear-gradient(160deg,#151a33,#1c1450);border:1px solid var(--line);margin-bottom:24px}
.hero h1{margin:0 0 8px;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:-.02em;line-height:1.1}
.hero p{margin:0;color:var(--mut);max-width:52ch}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.bar input{flex:1 1 220px;border-radius:999px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 16px;color:var(--mut)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.list{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:8px}
.item h2{margin:0;font-size:1.15rem}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mut);font-size:12.5px}
.tag{background:#222a4d;color:var(--ink);padding:3px 10px;border-radius:999px}
.tag.agent{background:#3b2a8f}.tag.brief{background:#0f5a4a}.tag.team{background:#7a3d12}
pre{white-space:pre-wrap;margin:0;background:#0e1120;border:1px solid var(--line);border-radius:12px;padding:14px;font:13px/1.6 "Geist Mono",ui-monospace,monospace;max-height:340px;overflow:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:12px;max-width:480px;margin:40px auto}
.panel h2{margin:0}
label{display:grid;gap:6px;color:var(--mut);font-size:13px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.note{color:var(--mut);font-size:13px;margin:0}
#add{margin-bottom:18px;max-width:none;margin-top:0}
[hidden]{display:none!important}
</style></head><body><div class="wrap">

<div id="setup" class="panel" hidden><h2>Setup needed</h2><p class="note">Paste your Firebase config into the <code>firebaseConfig</code> object at the top of the script in index.html.</p></div>

<div id="gate" class="panel" hidden>
  <h2 class="logo">Fazza | فزعة</h2>
  <p class="note" data-i="gateText"></p>
  <label><span data-i="name"></span><input id="gName" autocomplete="name"></label>
  <label><span data-i="email"></span><input id="gEmail" type="email" autocomplete="email"></label>
  <button class="btn go" id="gBtn" data-i="send"></button>
  <p class="note" id="gMsg"></p>
  <button class="btn" id="gLang"></button>
</div>

<div id="app" hidden>
<header>
  <span class="logo">Fazza | فزعة</span>
  <span class="stat"><b id="sMem">0</b> <span data-i="members"></span></span>
  <span class="stat"><b id="sCop">0</b> <span data-i="copies"></span></span>
  <button class="btn" id="lang"></button>
  <button class="btn" id="out" data-i="signout"></button>
</header>
<section class="hero"><h1 data-i="title"></h1><p data-i="sub"></p></section>
<div class="row" style="margin-bottom:14px"><button class="btn go" id="addBtn" data-i="add"></button></div>

<form id="add" class="panel" hidden>
  <label><span data-i="ptitle"></span><input id="aTitle" required maxlength="120" dir="auto"></label>
  <label><span data-i="ptext"></span><textarea id="aText" required dir="auto"></textarea></label>
  <div class="note"><span data-i="detected"></span>: <span class="tag" id="aCat">-</span></div>
  <label class="chk"><input type="checkbox" id="aShow"><span data-i="showEmail"></span></label>
  <div class="row"><button class="btn go" data-i="publish"></button><button type="button" class="btn" id="aCancel" data-i="cancel"></button></div>
</form>

<div class="bar"><input id="q" type="search" data-p="search">
  <button class="chip" data-f="all" aria-pressed="true"></button>
  <button class="chip" data-f="agent" aria-pressed="false"></button>
  <button class="chip" data-f="brief" aria-pressed="false"></button>
  <button class="chip" data-f="team" aria-pressed="false"></button>
</div>
<div class="list" id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* 1) PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web) */
const firebaseConfig = {
  apiKey: "AIzaSyCYX5iPoILU5ku9dD-qrBkCmIdRQ436C4k",
  authDomain: "fazza-768e5.firebaseapp.com",
  projectId: "fazza-768e5",
  storageBucket: "fazza-768e5.firebasestorage.app",
  messagingSenderId: "365089063148",
  appId: "1:365089063148:web:901830aaa203dd302865c9"
};

const T = {
 en:{title:"Prompts that get work done",sub:"Browse ready-to-use prompts for agents, briefs and team tools. Copy one, paste it into Claude, or share your own.",
  gateText:"Sign in with your email to browse the prompts. We'll send you a one-click link, no password.",name:"Your name",email:"Email",send:"Send me the link",
  sent:"Check your inbox and open the link.",members:"members",copies:"copies",signout:"Sign out",add:"+ Add your prompt",ptitle:"Title",ptext:"Prompt",
  detected:"Detected type",showEmail:"Show my email next to my name",publish:"Publish",cancel:"Cancel",search:"Search prompts",
  all:"All",agent:"Agents",brief:"Briefs",team:"Team tools",copy:"Copy prompt",copied:"Copied",view:"View",hide:"Hide",by:"by",anon:"Anonymous",empty:"No prompts yet."},
 ar:{title:"أوامر تُنجز العمل",sub:"تصفّح أوامر جاهزة للوكلاء والملخصات وأدوات الفريق. انسخ أمرًا والصقه في Claude، أو شارك أمرك.",
  gateText:"سجّل بريدك الإلكتروني لتصفّح الأوامر. سنرسل لك رابطًا بنقرة واحدة، بدون كلمة مرور.",name:"اسمك",email:"البريد الإلكتروني",send:"أرسل لي الرابط",
  sent:"تحقق من بريدك وافتح الرابط.",members:"عضو",copies:"نسخة",signout:"تسجيل الخروج",add:"+ أضف أمرك",ptitle:"العنوان",ptext:"الأمر",
  detected:"النوع المكتشف",showEmail:"أظهر بريدي بجانب اسمي",publish:"نشر",cancel:"إلغاء",search:"ابحث في الأوامر",
  all:"الكل",agent:"وكلاء",brief:"ملخصات",team:"أدوات الفريق",copy:"نسخ الأمر",copied:"تم النسخ",view:"عرض",hide:"إخفاء",by:"بواسطة",anon:"مجهول",empty:"لا توجد أوامر بعد."}
};
let lang = localStorage.lang || (navigator.language||"").startsWith("ar") ? "ar" : "en";
if (localStorage.lang) lang = localStorage.lang;
const t = k => T[lang][k], $ = id => document.getElementById(id);
function h(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }

function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
  document.querySelectorAll("[data-f]").forEach(e=>e.textContent=t(e.dataset.f));
  $("lang").textContent = $("gLang").textContent = lang==="ar" ? "English" : "العربية";
  if (typeof render==="function") render();
}
function toggleLang(){ lang = lang==="ar"?"en":"ar"; localStorage.lang = lang; applyLang(); }
$("lang").onclick = $("gLang").onclick = toggleLang;

/* Auto-detect type: agent / brief / team tools */
const RULES = {
 agent:/agent|autonom|tool use|workflow|automat|multi-step|orchestrat|وكيل|تلقائي|أتمتة|سير عمل/gi,
 brief:/brief|summar|report|executive|overview|digest|memo|ملخص|تقرير|موجز|نظرة عامة/gi,
 team:/team|meeting|stakeholder|collaborat|sprint|stand-?up|onboard|retro|فريق|اجتماع|تعاون|الموظفين/gi};
function classify(s){
  let best="agent", max=-1;
  for (const k in RULES){ const n=(s.match(RULES[k])||[]).length; if(n>max){max=n;best=k;} }
  return best;
}
function updateDetected(){
  const s = $("aTitle").value+" "+$("aText").value, c = $("aTitle").value||$("aText").value ? classify(s) : null;
  $("aCat").textContent = c ? t(c) : "-"; $("aCat").className = "tag "+(c||"");
}
$("aTitle").oninput = $("aText").oninput = updateDetected;

if (firebaseConfig.apiKey === "PASTE") { $("setup").hidden = false; applyLang(); }
else {
const app = firebase.initializeApp(firebaseConfig), auth = firebase.auth(), db = firebase.firestore();
const inc = firebase.firestore.FieldValue.increment, stats = db.doc("stats/global");
let user=null, prompts=[], filter="all", open=new Set(), unsub=null;

/* Email sign-in (link) */
$("gBtn").onclick = async () => {
  const email=$("gEmail").value.trim(), name=$("gName").value.trim();
  if(!email||!name){ $("gMsg").textContent="✱"; return; }
  try{
    await auth.sendSignInLinkToEmail(email,{url:location.origin+location.pathname,handleCodeInApp:true});
    localStorage.signinEmail=email; localStorage.signinName=name; $("gMsg").textContent=t("sent");
  }catch(e){ $("gMsg").textContent=e.message; }
};
$("out").onclick = () => auth.signOut();

async function finishLink(){
  if(!auth.isSignInWithEmailLink(location.href)) return;
  const email = localStorage.signinEmail || prompt("Confirm your email");
  try{
    const r = await auth.signInWithEmailLink(email, location.href);
    const ref = db.doc("users/"+r.user.uid), snap = await ref.get();
    if(!snap.exists){
      await ref.set({email, name:localStorage.signinName||"", createdAt:Date.now()});
      await stats.set({members:inc(1)},{merge:true});
    }
  }catch(e){ console.error(e); }
  history.replaceState(null,"",location.pathname);
}

auth.onAuthStateChanged(async u=>{
  user=u; $("gate").hidden=!!u; $("app").hidden=!u;
  if(unsub){unsub();unsub=null;}
  if(!u){ applyLang(); return; }
  unsub = db.collection("prompts").orderBy("createdAt","desc").onSnapshot(s=>{
    prompts=s.docs.map(d=>({id:d.id,...d.data()})); render();
  });
  stats.onSnapshot(d=>{ const x=d.data()||{}; $("sMem").textContent=x.members||0; $("sCop").textContent=x.copies||0; });
  applyLang();
});
finishLink();

/* Add prompt */
$("addBtn").onclick = () => { $("add").hidden=false; $("aTitle").focus(); };
$("aCancel").onclick = () => { $("add").hidden=true; };
$("add").onsubmit = async e => {
  e.preventDefault();
  const title=$("aTitle").value.trim(), text=$("aText").value.trim();
  const me = (await db.doc("users/"+user.uid).get()).data()||{};
  await db.collection("prompts").add({
    title, text, category:classify(title+" "+text), copies:0, createdAt:Date.now(),
    authorUid:user.uid, authorName:me.name||"", authorEmail:$("aShow").checked?user.email:""
  });
  $("add").reset(); $("add").hidden=true; updateDetected();
};

/* Copy + count */
async function copyPrompt(p, btn){
  try{ await navigator.clipboard.writeText(p.text); }catch(e){}
  btn.textContent=t("copied"); btn.classList.add("ok"); setTimeout(()=>{btn.textContent=t("copy");btn.classList.remove("ok");},1800);
  db.doc("prompts/"+p.id).update({copies:inc(1)}).catch(()=>{});
  stats.set({copies:inc(1)},{merge:true}).catch(()=>{});
}

/* Render */
$("q").oninput = () => render();
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
  filter=b.dataset.f; document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b)); render();
});
window.render = function(){
  const list=$("list"); list.replaceChildren();
  const q=$("q").value.toLowerCase();
  const shown=prompts.filter(p=>(filter==="all"||p.category===filter)&&(p.title+" "+p.text).toLowerCase().includes(q));
  if(!shown.length){ list.append(h("p","note",t("empty"))); return; }
  for(const p of shown){
    const it=h("article","item"), m=h("div","meta");
    const who=p.authorName?(p.authorName+(p.authorEmail?" ("+p.authorEmail+")":"")):t("anon");
    m.append(h("span","tag "+p.category,t(p.category)), h("span",null,t("by")+" "+who), h("span",null,"· "+(p.copies||0)+" "+t("copies")));
    const h2=h("h2",null,p.title); h2.dir="auto";
    const row=h("div","row"), view=h("button","btn",open.has(p.id)?t("hide"):t("view")), cp=h("button","btn go",t("copy"));
    view.onclick=()=>{open.has(p.id)?open.delete(p.id):open.add(p.id);render();};
    cp.onclick=()=>copyPrompt(p,cp);
    row.append(h("span","sp"),view,cp);
    it.append(m,h2);
    if(open.has(p.id)){ const pre=h("pre",null,p.text); pre.dir="auto"; it.append(pre); }
    it.append(row); list.append(it);
  }
};
applyLang();
}
</script></div></body></html>
